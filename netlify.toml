[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Crew phone app and NFC/QR tag links open the single-page app.
[[redirects]]
  from = "/t/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/field"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/field/*"
  to = "/index.html"
  status = 200
